name: UI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch/PR so we don't burn minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest ships Chrome out of the box, but its pre-installed Firefox is a
        # snap package that reliably fails to launch under Selenium automation (snap
        # confinement blocks the profile/session setup) - install a real binary instead
        # (below). Edge needs its own explicit setup step too. Safari is deliberately
        # excluded: it doesn't run on Linux.
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Set up Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Compile and assemble (skip tests)
        run: ./gradlew build -x test

      # testng-ui.xml is UI-only and deliberately has no hard-coded
      # <parameter name="browser">, so BaseWebTest falls back to this -Dbrowser system
      # property per matrix leg -- each leg runs the UI suite against exactly one browser.
      # -Dbrowser.<name>.headless=true is required: ubuntu-latest has no X server, so a
      # non-headless browser launch fails outright here even though it works fine locally.
      - name: Run UI tests (${{ matrix.browser }})
        run: >
          ./gradlew test
          -Dbrowser=${{ matrix.browser }}
          -Dbrowser.${{ matrix.browser }}.headless=true
          -Dtestng.suites=src/test/resources/testng/testng-ui.xml

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ui-${{ matrix.browser }}
          path: build/reports/allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-ui-${{ matrix.browser }}
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
