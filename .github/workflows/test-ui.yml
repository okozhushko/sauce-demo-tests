name: UI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch/PR so we don't burn minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest ships Chrome and Firefox out of the box. Edge needs an explicit
        # setup step (below). Safari is deliberately excluded: it doesn't run on Linux.
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Compile and assemble (skip tests)
        run: ./gradlew build -x test

      # NOTE: src/test/resources/testng/testng-parallel.xml currently hard-codes a
      # <parameter name="browser"> per <test> block (chrome/firefox/edge) and runs them
      # concurrently within a single suite (parallel="tests"). The -Dbrowser value below
      # only narrows execution to this matrix leg's browser if BaseWebTest resolves the
      # browser from the system property as a fallback/override to that suite parameter.
      # Confirm this with whoever owns BaseWebTest/Config -- otherwise every matrix leg
      # will simply re-run all three browsers instead of just its own.
      - name: Run UI tests (${{ matrix.browser }})
        run: >
          ./gradlew test
          -Dbrowser=${{ matrix.browser }}
          -Dtestng.suites=src/test/resources/testng/testng-parallel.xml

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ui-${{ matrix.browser }}
          path: build/reports/allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-ui-${{ matrix.browser }}
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
