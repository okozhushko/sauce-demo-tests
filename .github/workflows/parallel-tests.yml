name: Parallel Cross-Browser Tests

# Nightly (+ manual) full cross-browser regression. testng-parallel.xml already runs
# chrome/firefox/edge concurrently within a single suite (parallel="tests", one <test>
# block per browser with its own hard-coded <parameter name="browser">), so this is a
# single job, not a per-browser CI matrix -- a matrix here would just re-run all three
# browsers redundantly on every leg. Fast per-push/PR feedback per browser lives in
# test-ui.yml instead, so this workflow is scoped to schedule/manual only to avoid
# duplicate coverage.
on:
  schedule:
    - cron: '0 2 * * *' # nightly, 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parallel-ui-tests:
    name: Parallel Cross-Browser UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Microsoft Edge
        uses: browser-actions/setup-edge@v1

      - name: Compile and assemble (skip tests)
        run: ./gradlew build -x test

      # ubuntu-latest has no X server, so every browser this suite launches (chrome,
      # firefox, edge - all in one suite invocation, see testng-parallel.xml) needs
      # headless=true here even though local/dev runs keep it false to watch the browser.
      - name: Run cross-browser UI suite
        run: >
          ./gradlew test
          -Dbrowser.chrome.headless=true
          -Dbrowser.firefox.headless=true
          -Dbrowser.edge.headless=true
          -Dtestng.suites=src/test/resources/testng/testng-parallel.xml

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-parallel
          path: build/reports/allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-parallel
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
