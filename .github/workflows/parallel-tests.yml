name: Parallel Cross-Browser Tests

# Demonstrates cross-browser UI execution as a parallel matrix (one runner per browser)
# and doubles as the nightly regression run. NOTE: this currently overlaps almost
# entirely with test-ui.yml on push/PR (same suite, same matrix) -- both were requested
# explicitly, but worth reconsidering whether push/PR coverage should live in only one
# of the two workflows, with this one scoped to the nightly `schedule` trigger only.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *' # nightly, 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parallel-ui-tests:
    name: Parallel UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # fail-fast: false is the point of this workflow -- one browser failing must not
      # cancel the others, since the whole purpose is independent parallel coverage.
      fail-fast: false
      matrix:
        # ubuntu-latest ships Chrome and Firefox out of the box. Edge needs an explicit
        # setup step (below). Safari is deliberately excluded: it doesn't run on Linux.
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Compile and assemble (skip tests)
        run: ./gradlew build -x test

      # See the same note in test-ui.yml: testng-parallel.xml hard-codes a browser per
      # <test> block and runs all three concurrently within one suite (parallel="tests"),
      # so -Dbrowser only narrows this matrix leg if BaseWebTest reads it as an override.
      - name: Run UI tests (${{ matrix.browser }})
        run: >
          ./gradlew test
          -Dbrowser=${{ matrix.browser }}
          -Dtestng.suites=src/test/resources/testng/testng-parallel.xml

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-parallel-${{ matrix.browser }}
          path: build/reports/allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-parallel-${{ matrix.browser }}
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
