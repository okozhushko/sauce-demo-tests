name: API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch/PR so we don't burn minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile and assemble (skip tests)
        run: ./gradlew build -x test

      - name: Run API tests
        run: ./gradlew test -Dtestng.suites=src/test/resources/testng/testng-api.xml

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api
          path: build/reports/allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-api
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
