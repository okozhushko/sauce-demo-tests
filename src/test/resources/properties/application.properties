# Environment configuration
environment=dev
# Swag Labs (saucedemo.com) - the standard Selenium/Playwright QA training demo site, see
# LoginPage/InventoryPage/ProductPage/CartPage for the flows this backs. Public test account
# credentials live in com.example.ui.SauceDemoUsers, not here - see that class' Javadoc.
base.url=https://www.saucedemo.com
api.base.url=https://jsonplaceholder.typicode.com

# Browser
browser=chrome

# Timeouts (in milliseconds)
timeout=10000
page.load.timeout=15000

# Browser configuration
# CI overrides these per-run via -Dbrowser.<name>.headless=true (no X server on the
# runners); local/dev runs stay non-headless by default so you can watch the browser.
browser.chrome.headless=false
browser.firefox.headless=false
browser.edge.headless=false
browser.safari.headless=false

# Retry configuration
retry.count=2
