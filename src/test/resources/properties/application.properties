# Environment configuration
environment=dev
# Public demo target with a real login form (the-internet.herokuapp.com) so the UI suite
# is runnable out of the box - see LoginPage/DashboardPage for the flow this backs.
base.url=https://the-internet.herokuapp.com
api.base.url=https://jsonplaceholder.typicode.com

# Browser
browser=chrome

# Timeouts (in milliseconds)
timeout=10000
page.load.timeout=15000

# Browser configuration
browser.chrome.headless=false
browser.firefox.headless=false
browser.edge.headless=false
browser.safari.headless=false

# Logging
logging.level=INFO

# Retry configuration
retry.count=2

# Allure configuration
allure.results.directory=build/allure-results
